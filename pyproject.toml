[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cits-transit-signal-priority-hub"
version = "1.0.0"
description = "Event-driven V2I transit signal priority: J2735-style messages, pub/sub broker, RSU priority logic, median BRT study."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "pydantic>=2.6,<3", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
tsp-hub = "tsp_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
